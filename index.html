<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>タイムパウズ</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu-screen" class="screen active">

  <h1>タイムパウズ</h1>

  <p>5分時空ローグライク</p>

  <button id="start-button">
    ゲーム開始
  </button>

</div>

<div id="character-screen" class="screen">

  <h2>主人公選択</h2>

  <div class="character-list">

    <button class="character-button"
            data-character="woosan">
      ウーサン
    </button>

    <button class="character-button"
            data-character="gorillin">
      ゴリリン
    </button>

    <button class="character-button"
            data-character="fukkurou">
      フックロウ
    </button>

    <button class="character-button"
            data-character="mongrin">
      モングリン・モングラン
    </button>

  </div>

  <div id="character-info"></div>

  <button id="confirm-character"
          disabled>
    冒険開始
  </button>

</div>

<div id="game-screen" class="screen">

  <div class="top-bar">

    <div>
      残り時間:
      <span id="time-display">
        300
      </span>
    </div>

    <div>
      階層:
      <span id="floor-display">
        1
      </span>
    </div>

    <div>
      HP:
      <span id="hp-display">
        0
      </span>
    </div>

  </div>

  <div class="stats-bar">

    <div>
      ATK:
      <span id="atk-display"></span>
    </div>

    <div>
      DEF:
      <span id="def-display"></span>
    </div>

    <div>
      CTR:
      <span id="ctr-display"></span>%
    </div>

  </div>

  <div id="event-text"
       class="event-text">
  </div>

  <div class="choice-area">

    <button id="choice-1"></button>

    <button id="choice-2"></button>

  </div>

</div>

<div id="result-screen" class="screen">

  <h2>探索終了</h2>

  <div id="result-info"></div>

  <button id="back-menu">
    メインメニューへ
  </button>

</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>

</body>
</html>
