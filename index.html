<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no" />

    <title>タイムパウズ</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- ========================= -->
    <!-- メインメニュー -->
    <!-- ========================= -->
    <section id="main-menu" class="screen active">

        <div class="title-area">
            <h1>タイムパウズ</h1>
            <p class="version">Ver 0.1</p>
        </div>

        <div class="menu-buttons">
            <button id="pve-button">PVE</button>

            <button disabled>
                デッキ編集
                <span>(準備中)</span>
            </button>

            <button disabled>
                設定
                <span>(準備中)</span>
            </button>
        </div>

    </section>

    <!-- ========================= -->
    <!-- デッキ選択 -->
    <!-- ========================= -->
    <section id="deck-select" class="screen">

        <div class="top-bar">
            <h2>PVE - デッキ選択</h2>
            <button id="back-menu-button">戻る</button>
        </div>

        <div class="deck-select-layout">

            <!-- デッキ一覧 -->
            <div class="deck-list">

                <div class="deck-button"
                     data-deck="woosan">

                    <h3>ウーサン</h3>
                    <p>高速展開アグロ</p>

                </div>

                <div class="deck-button"
                     data-deck="gorillin">

                    <h3>ゴリリン</h3>
                    <p>重量級ミッドレンジ</p>

                </div>

                <div class="deck-button"
                     data-deck="fukkurou">

                    <h3>フックロウ</h3>
                    <p>魔法コントロール</p>

                </div>

            </div>

            <!-- デッキ詳細 -->
            <div class="deck-detail">

                <h2 id="deck-name">
                    デッキを選択
                </h2>

                <p id="deck-description">
                    左からデッキを選んでください。
                </p>

                <div id="deck-cards">

                </div>

                <button id="confirm-deck-button"
                        disabled>

                    このデッキで出撃

                </button>

            </div>

        </div>

    </section>

    <!-- ========================= -->
    <!-- バトル画面 -->
    <!-- ========================= -->
    <section id="battle-screen" class="screen">

        <!-- 上部情報 -->
        <div class="battle-header">

            <div class="enemy-info">
                <div>CPU HP:
                    <span id="enemy-hp">20</span>
                </div>

                <div>マナ:
                    <span id="enemy-mana">0</span>
                </div>
            </div>

            <div class="turn-info">
                <div id="turn-display">
                    TURN 1
                </div>

                <div id="phase-display">
                    PLAYER TURN
                </div>
            </div>

            <div class="player-info">
                <div>HP:
                    <span id="player-hp">20</span>
                </div>

                <div>マナ:
                    <span id="player-mana">0</span>
                </div>
            </div>

        </div>

        <!-- 相手手札 -->
        <div class="enemy-hand-area">

            <div id="enemy-hand"
                 class="hand">

            </div>

        </div>

        <!-- 相手盤面 -->
        <div class="field-area enemy-field">

            <!-- 後衛 -->
            <div class="field-row">

                <div class="field-slot enemy-slot"
                     data-side="enemy"
                     data-row="back"
                     data-index="0"></div>

                <div class="field-slot enemy-slot"
                     data-side="enemy"
                     data-row="back"
                     data-index="1"></div>

                <div class="field-slot enemy-slot"
                     data-side="enemy"
                     data-row="back"
                     data-index="2"></div>

            </div>

            <!-- 前衛 -->
            <div class="field-row">

                <div class="field-slot enemy-slot"
                     data-side="enemy"
                     data-row="front"
                     data-index="0"></div>

                <div class="field-slot enemy-slot"
                     data-side="enemy"
                     data-row="front"
                     data-index="1"></div>

                <div class="field-slot enemy-slot"
                     data-side="enemy"
                     data-row="front"
                     data-index="2"></div>

            </div>

        </div>

        <!-- 時空異常 -->
        <div id="anomaly-display">

            時空安定

        </div>

        <!-- 自分盤面 -->
        <div class="field-area player-field">

            <!-- 前衛 -->
            <div class="field-row">

                <div class="field-slot player-slot"
                     data-side="player"
                     data-row="front"
                     data-index="0"></div>

                <div class="field-slot player-slot"
                     data-side="player"
                     data-row="front"
                     data-index="1"></div>

                <div class="field-slot player-slot"
                     data-side="player"
                     data-row="front"
                     data-index="2"></div>

            </div>

            <!-- 後衛 -->
            <div class="field-row">

                <div class="field-slot player-slot"
                     data-side="player"
                     data-row="back"
                     data-index="0"></div>

                <div class="field-slot player-slot"
                     data-side="player"
                     data-row="back"
                     data-index="1"></div>

                <div class="field-slot player-slot"
                     data-side="player"
                     data-row="back"
                     data-index="2"></div>

            </div>

        </div>

        <!-- 手札 -->
        <div class="player-hand-area">

            <div id="player-hand"
                 class="hand">

            </div>

        </div>

        <!-- 操作 -->
        <div class="battle-controls">

            <button id="end-turn-button">
                ターン終了
            </button>

        </div>

    </section>

    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
