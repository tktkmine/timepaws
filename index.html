<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 user-scalable=no">

  <title>タイムパウズ</title>

  <link rel="stylesheet"
        href="style.css">

</head>

<body>

<!-- ========================= -->
<!-- タイトル -->
<!-- ========================= -->

<div id="menu-screen"
     class="screen active">

  <img src="img/logo.png"
       class="logo">

  <p>
    5分時空ローグライク
  </p>

  <button id="start-button">
    ゲーム開始
  </button>

  <button id="help-button">
    ヘルプ
  </button>

  <button id="encyclopedia-button">
    図鑑
  </button>

</div>

<!-- ========================= -->
<!-- キャラ選択 -->
<!-- ========================= -->

<div id="character-screen"
     class="screen">

  <h2>主人公選択</h2>

  <div class="character-list">

    <button class="character-button"
            data-character="woosan">
      ウーサン
    </button>

    <button class="character-button"
            data-character="gorillin">
      ゴリリン
    </button>

    <button class="character-button"
            data-character="fukkurou">
      フックロウ
    </button>

    <button class="character-button"
            data-character="mongrin">
      モングリン
    </button>

  </div>

  <img id="character-image"
       class="character-image">

  <div id="character-info"></div>

  <button id="confirm-character"
          disabled>

    冒険開始

  </button>

</div>

<!-- ========================= -->
<!-- ゲーム -->
<!-- ========================= -->

<div id="game-screen"
     class="screen">

  <div class="top-bar">

    <div>
      ⏳
      <span id="time-display"></span>
    </div>

    <div>
      🏰
      <span id="floor-display"></span>
    </div>

  </div>

  <div class="hp-area">

    <div>
      HP:
      <span id="hp-display"></span>
    </div>

    <div class="hp-bar">

      <div id="hp-fill"></div>

    </div>

  </div>

  <div class="stats-bar">

    <div>
      ATK:
      <span id="atk-display"></span>
    </div>

    <div>
      DEF:
      <span id="def-display"></span>
    </div>

    <div>
      CTR:
      <span id="ctr-display"></span>%
    </div>

  </div>

  <div id="event-text"
       class="event-text">
  </div>

  <div class="choice-area">

    <button id="choice-1"></button>

    <button id="choice-2"></button>

  </div>

  <button id="result-button"
          style="display:none;">

    結果を見る

  </button>

</div>

<!-- ========================= -->
<!-- リザルト -->
<!-- ========================= -->

<div id="result-screen"
     class="screen">

  <h2>探索終了</h2>

  <div id="result-info"></div>

  <button id="back-menu">
    メインメニューへ
  </button>

</div>

<!-- ========================= -->
<!-- ヘルプ -->
<!-- ========================= -->

<div id="help-screen"
     class="screen">

  <h2>ヘルプ</h2>

  <div class="help-box">

    <p>
      5分以内にどこまで
      階層を進めるか競う
      ローグライクゲーム。
    </p>

    <hr>

    <p>
      【戦闘】
      自動戦闘。
    </p>

    <p>
      【お宝探し】
      宝を獲得。
      稀に罠。
    </p>

    <p>
      【時空の渦】
      時間変動。
    </p>

    <p>
      【休息】
      時間を消費し
      HP全回復。
    </p>

    <p>
      【時の加速】
      時間を消費し
      3階層進む。
    </p>

  </div>

  <button class="back-button">
    戻る
  </button>

</div>

<!-- ========================= -->
<!-- 図鑑 -->
<!-- ========================= -->

<div id="encyclopedia-screen"
     class="screen">

  <h2>図鑑</h2>

  <div id="encyclopedia-content">

  </div>

  <button class="back-button">
    戻る
  </button>

</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>

</body>
</html>
